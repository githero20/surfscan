name: Release

# Stages a release on npm when a version tag such as v0.1.0 is pushed.
# Uses npm trusted publishing (OIDC), so no npm token is stored. The package's
# Trusted Publisher settings on npmjs.com must point at this repo and release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing) and record provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Stages the release instead of publishing it. A maintainer approves it with
      # 2FA (npm stage approve <id>, or on npmjs.com) before it goes live.
      - run: npm stage publish --access public
