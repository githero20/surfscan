name: Release

# Publishes to npm when a version tag such as v0.1.0 is pushed.
# Needs an NPM_TOKEN secret (an npm automation token) in the repository settings.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm record where the package was built (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
